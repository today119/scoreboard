<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>라이브 스코어보드</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  /* ── 색 팔레트 ───────────────────────────────────────
     dark = 기본. light 는 body.light 로 갈아끼운다.
     오버레이(점수판)와 조작 화면이 같은 변수를 쓴다. */
  :root{
    /* 점수판 */
    --bd-bg:rgba(2,6,23,.95);      --bd-line:rgba(255,255,255,.10);
    --bd-text:#fff;                --bd-shadow:0 40px 80px rgba(0,0,0,.5);
    --bd-center:rgba(0,0,0,.6);    --bd-center-line:rgba(255,255,255,.15);
    --bd-period:#3B82F6;           --bd-stage:#fff;
    --bd-accent:#FACC15;           --bd-accent-line:#FDE68A;
    --bd-dot-off:rgba(0,0,0,.6);   --bd-dot-line:rgba(255,255,255,.3);
    --bd-name-shadow:0 2px 6px rgba(0,0,0,.5);
    --sum-bg:rgba(0,20,41,.95);    --sum-dim:rgba(255,255,255,.2);
    --sum-hd:rgba(255,255,255,.25);--sum-sep:rgba(255,255,255,.06);
    --sum-sethd:rgba(96,165,250,.5);
    /* 테니스 */
    --tn-head:#2563EB;             --tn-hist:rgba(0,0,0,.4);
    --tn-hist-fg:#64748B;          --tn-hist-win:#CBD5E1;
    --tn-gm:rgba(14,116,144,.85);  --tn-gm-fg:#fff;
    --tn-pt:#fff;                  --tn-pt-fg:#020617;
    /* 조작 화면 */
    --ui-bg:#0B1220; --ui-fg:#E5E7EB; --ui-sub:#94A3B8;
    --ui-card:#111A2E; --ui-card2:#0E1729; --ui-line:#1F2A44;
    --ui-input:#0B1220; --ui-input-line:#26334D;
    --ui-btn:#18233B; --ui-btn-sub:#1F2937; --ui-h2:#93C5FD; --ui-url:#93C5FD;
  }
  body.light{
    --bd-bg:rgba(255,255,255,.95);  --bd-line:rgba(0,0,0,.08);
    --bd-text:#0F172A;              --bd-shadow:0 30px 60px rgba(0,0,0,.28);
    --bd-center:rgba(15,23,42,.06); --bd-center-line:rgba(0,0,0,.10);
    --bd-period:#1D4ED8;            --bd-stage:#0F172A;
    --bd-accent:#F59E0B;            --bd-accent-line:#B45309;
    --bd-dot-off:rgba(15,23,42,.10);--bd-dot-line:rgba(15,23,42,.25);
    --bd-name-shadow:none;
    --sum-bg:rgba(255,255,255,.96); --sum-dim:rgba(15,23,42,.22);
    --sum-hd:rgba(15,23,42,.35);    --sum-sep:rgba(15,23,42,.08);
    --sum-sethd:rgba(29,78,216,.55);
    --tn-head:#1D4ED8;              --tn-hist:rgba(15,23,42,.05);
    --tn-hist-fg:#94A3B8;           --tn-hist-win:#0F172A;
    --tn-gm:#0E7490;                --tn-gm-fg:#fff;
    --tn-pt:#0F172A;                --tn-pt-fg:#fff;
    --ui-bg:#F1F5F9; --ui-fg:#0F172A; --ui-sub:#64748B;
    --ui-card:#FFFFFF; --ui-card2:#F8FAFC; --ui-line:#E2E8F0;
    --ui-input:#FFFFFF; --ui-input-line:#CBD5E1;
    --ui-btn:#E2E8F0; --ui-btn-sub:#CBD5E1; --ui-h2:#1D4ED8; --ui-url:#1D4ED8;
  }

  /* ── 공통 ──
     배경은 반드시 투명. OBS 브라우저 소스·카메라파이 웹 오버레이가
     이 페이지를 영상 위에 얹기 때문에 바탕이 깔리면 화면을 가린다. */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:transparent;font-family:Inter,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .tab{font-variant-numeric:tabular-nums}

  /* ── 오버레이 ── */
  #sbStage{position:fixed;inset:0;overflow:hidden;pointer-events:none}
  .anchor{position:fixed;transition:transform .2s ease-out}
  .board{
    display:flex;align-items:stretch;min-height:90px;
    background:var(--bd-bg);backdrop-filter:blur(14px);
    border:1px solid var(--bd-line);border-radius:18px;overflow:hidden;
    box-shadow:var(--bd-shadow);
  }
  .side{display:flex;align-items:center;gap:16px;padding:12px 24px;min-width:190px}
  .side.away{text-align:right}
  .bar{width:10px;height:40px;border-radius:99px;flex:none}
  .sets{display:flex;flex-direction:column;gap:4px}
  .dot{width:10px;height:10px;border-radius:99px;border:1px solid var(--bd-dot-line);
       background:var(--bd-dot-off);transition:all .3s}
  .dot.on{background:var(--bd-accent);border-color:var(--bd-accent-line);
          box-shadow:0 0 8px color-mix(in srgb, var(--bd-accent) 60%, transparent)}
  .tname{font-size:26px;font-weight:900;color:var(--bd-text);text-transform:uppercase;line-height:1;
         letter-spacing:-.02em;text-shadow:var(--bd-name-shadow);white-space:nowrap;max-width:230px;
         overflow:hidden;text-overflow:ellipsis}
  .score{font-size:42px;font-weight:900;color:var(--bd-text);line-height:1}
  .side.home .score{margin-left:auto}
  .side.away .score{margin-right:auto}
  .serve{width:13px;height:13px;border-radius:99px;background:var(--bd-accent);
         border:2px solid var(--bd-accent-line);flex:none;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .center{background:var(--bd-center);padding:0 30px;border-left:1px solid var(--bd-center-line);
          border-right:1px solid var(--bd-center-line);display:flex;flex-direction:column;
          justify-content:center;align-items:center;min-width:150px;gap:2px}
  .stage{font-size:11px;font-weight:900;color:var(--bd-stage);text-transform:uppercase;letter-spacing:.18em}
  .period{font-size:17px;font-weight:900;color:var(--bd-period);letter-spacing:.2em;line-height:1}
  .timer{font-size:24px;font-weight:800;color:var(--bd-text);font-family:ui-monospace,Menlo,monospace;line-height:1.1}
  .nm{display:flex;flex-direction:column;gap:5px}
  .side.away .nm{align-items:flex-end}
  .fl{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--sum-hd);line-height:1;white-space:nowrap}
  .fl.bonus{color:var(--bd-accent)}
  .brand{padding:8px 20px;border-radius:12px;font-weight:900;font-style:italic;text-transform:uppercase;
         letter-spacing:.15em;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 30px rgba(0,0,0,.4)}

  /* 테니스 — 머리띠 + 선수 2줄 (지난 세트 | 게임 | 포인트) */
  .tboard{display:flex;flex-direction:column;min-width:440px;background:var(--bd-bg);backdrop-filter:blur(14px);
          border:1px solid var(--bd-line);border-radius:18px;overflow:hidden;box-shadow:var(--bd-shadow)}
  .thead{background:var(--tn-head);padding:6px 20px;display:flex;justify-content:space-between;align-items:center;
         gap:16px;color:#fff;font-weight:900;font-style:italic;text-transform:uppercase;font-size:18px;line-height:1.2}
  .thead .ts{letter-spacing:.12em}
  .thead .tsep{opacity:.35;margin:0 8px}
  .thead .ttime{font-family:ui-monospace,Menlo,monospace;font-style:normal;font-size:18px;color:#fff;line-height:1.2}
  .tbtag{background:#F97316;color:#fff;font-size:11px;font-style:normal;letter-spacing:.12em;
         padding:3px 8px;border-radius:6px;margin-left:10px;vertical-align:middle}
  .trow{display:flex;align-items:stretch;height:64px;border-bottom:1px solid var(--bd-line)}
  .trow:last-child{border-bottom:0}
  .trow .cbar{width:10px;flex:none}
  .trow .who{flex:1;display:flex;align-items:center;gap:14px;padding:0 22px;min-width:0}
  .trow .tname{font-size:21px;font-style:italic}
  .thist{display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--tn-hist);border-left:1px solid var(--bd-line)}
  .thist span{font-size:20px;font-weight:900;width:24px;text-align:center;color:var(--tn-hist-fg)}
  .thist span.win{color:var(--tn-hist-win)}
  .tgm{width:80px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--tn-gm);
       color:var(--tn-gm-fg);font-size:26px;font-weight:900}
  .tpt{width:96px;flex:none;display:flex;align-items:center;justify-content:center;background:var(--tn-pt);
       color:var(--tn-pt-fg);font-size:32px;font-weight:900}

  /* 경기 종료 요약 */
  .summary{background:var(--sum-bg);backdrop-filter:blur(20px);border-radius:18px;padding:18px 20px;
           border:1px solid var(--bd-line);box-shadow:var(--bd-shadow);min-width:360px}
  .summary .hd{font-size:10px;font-weight:900;color:var(--sum-hd);text-transform:uppercase;
               letter-spacing:.2em;font-style:italic}
  .srow{display:grid;gap:10px;align-items:center;height:36px}
  .sname{font-size:14px;font-weight:900;color:var(--bd-text);font-style:italic;text-transform:uppercase;
         white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sv{font-size:26px;font-weight:900;text-align:center;line-height:1;color:var(--sum-dim)}
  .sv.win{color:var(--bd-accent)}
  .sep{height:1px;background:var(--sum-sep);margin:4px 0}
  .sethd{font-size:10px;font-weight:700;color:var(--sum-sethd);text-align:center}

  /* ── 조작 화면 ── */
  body.control{background:var(--ui-bg);color:var(--ui-fg);padding:14px;padding-bottom:40px}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:17px;margin:0 0 4px;font-weight:900}
  .sub{color:var(--ui-sub);font-size:13px;margin-bottom:14px;line-height:1.6}
  .card{background:var(--ui-card);border:1px solid var(--ui-line);border-radius:16px;padding:14px;margin-bottom:12px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--ui-h2);font-weight:800;letter-spacing:.03em}
  .teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .team{background:var(--ui-card2);border:1px solid var(--ui-line);border-radius:14px;padding:12px;min-width:0}
  .grid2>*,.grid3>*{min-width:0}
  button.blink{background:#B45309;border-color:#F59E0B;color:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{background:#F59E0B}}
  .chks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px}
  .chk{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
  .chk input{width:18px;height:18px}
  .gadj{margin-top:8px;align-items:center}
  .gadj span{flex:1;font-size:12px;color:var(--ui-sub);font-weight:700;white-space:nowrap}
  .gadj button{flex:0 0 40px;min-height:34px;padding:0;font-size:18px}
  .team .top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .team input[type=text]{flex:1;min-width:0;background:var(--ui-input);border:1px solid var(--ui-input-line);
    color:var(--ui-fg);border-radius:10px;padding:10px;font-size:15px;font-weight:800}
  .team input[type=color]{width:38px;height:38px;border:1px solid var(--ui-input-line);border-radius:10px;
    background:var(--ui-input);padding:2px;flex:none}
  .big{font-size:54px;font-weight:900;text-align:center;line-height:1;margin:6px 0 10px}
  .row{display:flex;gap:8px}
  button{font-family:inherit;font-weight:800;border-radius:12px;border:1px solid var(--ui-input-line);
         background:var(--ui-btn);color:var(--ui-fg);font-size:15px;padding:14px;cursor:pointer;flex:1;min-height:52px}
  button:active{opacity:.7}
  button.plus{background:#1D4ED8;border-color:#3B82F6;color:#fff;font-size:22px}
  button.minus{background:var(--ui-btn-sub);font-size:22px;max-width:74px}
  button.on{background:#166534;border-color:#22C55E;color:#DCFCE7}
  button.warn{background:#B91C1C;border-color:#991B1B;color:#fff}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  label.f{display:block;font-size:12px;color:var(--ui-sub);margin:10px 0 5px;font-weight:700}
  input.t,select.t{width:100%;background:var(--ui-input);border:1px solid var(--ui-input-line);
    color:var(--ui-fg);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
  .hint{color:var(--ui-sub);font-size:12.5px;line-height:1.7;margin-top:10px}
  .hint b{color:var(--ui-fg)}
  .urlbox{background:var(--ui-input);border:1px solid var(--ui-input-line);border-radius:10px;padding:10px;
    font-size:12px;word-break:break-all;color:var(--ui-url);margin-top:6px;font-family:ui-monospace,Menlo,monospace}
  .prev{background:var(--ui-input);border:1px solid var(--ui-line);border-radius:14px;padding:16px;overflow-x:auto}
  .prev.dark{background:#0B1220}
  .prev.lightbg{background:#E2E8F0}
  .prevnote{font-size:11px;color:var(--ui-sub);margin-bottom:8px}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1E293B;border:1px solid #334155;
    color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;font-weight:700;opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:99;white-space:pre-line;text-align:center}
  .toast.show{opacity:1}
  /* 맨 끝에 둘 것 — 위의 기본 규칙보다 뒤에 와야 덮어쓴다 */
  @media (max-width:520px){            /* 폰 세로 — 두 팀 칸이 화면 밖으로 밀리지 않게 */
    body.control{padding:8px}
    .card{padding:10px}
    .teams{gap:8px}
    .team{padding:8px}
    button{padding:10px 4px;font-size:14px;min-height:48px;min-width:0}
    .row button.minus{flex:0 0 44px}
    button.plus{font-size:17px;white-space:nowrap}
    .row{gap:6px}
    .gadj button{flex-basis:34px;min-height:32px}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ─────────────────────────────────────────────────────────
   주소 옵션
     ?view=overlay|control   기본 control
     ?pos=TL|TC|TR|BL|BC|BR  오버레이 위치 (기본 BL)
     ?scale=1.2              오버레이 크기
     ?room=abc               (예정) 다른 기기에서 조작
   ───────────────────────────────────────────────────────── */
var Q = new URLSearchParams(location.search);
var VIEW  = (Q.get("view")||"control").toLowerCase();
var POS   = (Q.get("pos")||"BL").toUpperCase();
var SCALE = parseFloat(Q.get("scale")||"1") || 1;
var ROOM  = Q.get("room")||"";
if(!ROOM){ try{ ROOM = localStorage.getItem("sb_room")||""; }catch(e){} }
var THEME = (Q.get("theme")||"dark").toLowerCase()==="light" ? "light" : "dark";
var KEY   = "sb_state_v1" + (ROOM ? "_"+ROOM : "");

/* ── 종목 프리셋 ────────────────────────────────────────────
   unit     기간 이름 (SET 2, GAME 3 …)          periods  이름이 정해진 기간 (전반·후반 / 1Q…)
   sets     세트제 — 세트 점·세트 종료·결과표     serve    winner(득점팀) | tt(탁구 2점마다) | tennis
   target   세트 목표 점수 · winBy 점수차 · cap 상한 · lastTarget 마지막 세트 목표
   btns     득점 버튼 (농구 1·2·3)                fouls    팀파울 보너스 기준 (0 = 파울 안 씀)
   timer    up | down (없으면 시간 끔)            timerLen 내려가는 시간(분)
   직접 설정(CUSTOM)은 S.custom 을 읽어 같은 모양으로 만든다 → PR() */
var PRESETS = {
  VOLLEYBALL: {label:"배구",     emoji:"🏐", unit:"SET",  sets:true, serve:"winner", target:25, lastTarget:15, winBy:2, bestOf:5},
  TENNIS:     {label:"테니스",   emoji:"🎾", unit:"SET",  sets:true, serve:"tennis", bestOf:3},
  TABLETENNIS:{label:"탁구",     emoji:"🏓", unit:"GAME", sets:true, serve:"tt",     target:11, winBy:2, bestOf:5},
  BADMINTON:  {label:"배드민턴", emoji:"🏸", unit:"GAME", sets:true, serve:"winner", target:21, winBy:2, cap:30, bestOf:3},
  JOKGU:      {label:"족구",     emoji:"🦶", unit:"SET",  sets:true, serve:"winner", target:15, winBy:2, bestOf:3},
  SOCCER:     {label:"축구",     emoji:"⚽", periods:["전반","후반","연장 전반","연장 후반","승부차기"], timer:"up"},
  BASKETBALL: {label:"농구",     emoji:"🏀", periods:["1Q","2Q","3Q","4Q","OT"], btns:[1,2,3], fouls:5, timer:"down", timerLen:10},
  JUMPROPE:   {label:"줄넘기",   emoji:"🪢", unit:"ROUND", btns:[1,5,10]},
  ESPORTS:    {label:"이스포츠", emoji:"🎮", unit:"GAME", sets:true, bestOf:3},
  CUSTOM:     {label:"직접 설정", emoji:"🏆"}
};
function parseBtns(s){
  var a = String(s||"").split(/[^0-9]+/).map(Number).filter(function(n){ return n>0 && n<=1000; }).slice(0,3);
  return a.length ? a : [1];
}
function PR(){
  var b = PRESETS[S.sport] || PRESETS.CUSTOM;
  if(S.sport !== "CUSTOM") return b;
  var c = S.custom;
  return { label:b.label, emoji:b.emoji, unit:c.unit, sets:!!c.sets, serve:c.serve?"winner":"",
           fouls:c.fouls?5:0, btns:parseBtns(c.btns), target:+c.target||0, winBy:2 };
}

var DEF = {
  sport:"VOLLEYBALL",
  home:{name:"HOME", color:"#3B82F6", score:0, sets:0, hist:[], serve:true,  pts:0, games:0, fouls:0},
  away:{name:"AWAY", color:"#EF4444", score:0, sets:0, hist:[], serve:false, pts:0, games:0, fouls:0},
  stage:"", period:"SET 1",
  showTimer:false, timerRunning:false, timerBase:0, timerAcc:0,
  timerDir:"up", timerLen:10,                         // 내려가는 시간은 timerLen 분에서 뺀다
  tournament:"", channel:"",
  over:false, bestOf:3,
  firstServe:"home",                                  // 탁구: 이번 세트 첫 서브
  /* 테니스: pts 는 이번 게임에서 딴 포인트 수(숫자). 0·15·30·40·AD 는 화면에서만 바꿔 그린다. */
  tn:{games:6, noAd:false, tb:false, tbServer:"home"},
  custom:{unit:"SET", btns:"1", sets:false, serve:false, fouls:false, target:0}
};

/* 저장본·서버본을 기본값 위에 얹는다 (예전 저장본에 새 칸이 없어도 깨지지 않게) */
function merge(v){
  var d = JSON.parse(JSON.stringify(DEF));
  for(var k in v) d[k] = v[k];
  d.home = Object.assign(d.home, v.home||{});      // d 는 DEF 의 복사본이라 DEF 배열을 같이 쓰지 않는다
  d.away = Object.assign(d.away, v.away||{});
  d.tn   = Object.assign(d.tn,   v.tn||{});
  d.custom = Object.assign(d.custom, v.custom||{});
  if(d.sport === "GENERAL") d.sport = "CUSTOM";       // v1 의 「일반」
  if(!PRESETS[d.sport]) d.sport = "CUSTOM";
  if(!Array.isArray(d.home.hist)) d.home.hist = [];   // Firebase 는 빈 배열을 지운다
  if(!Array.isArray(d.away.hist)) d.away.hist = [];
  return d;
}
function load(){
  try{
    var v = JSON.parse(localStorage.getItem(KEY));
    if(!v || typeof v!=="object") return JSON.parse(JSON.stringify(DEF));
    return merge(v);
  }catch(e){ return JSON.parse(JSON.stringify(DEF)); }
}
var S = load();

/* ── 실시간 반영 ────────────────────────────────────────────
   ① 같은 브라우저의 창끼리  : BroadcastChannel
   ② 다른 기기·OBS 브라우저 소스 : 방 코드(?room=)로 서버를 거친다
      Firebase 실시간 DB 의 REST 스트리밍(EventSource)을 쓴다 —
      SDK·로그인 없이 순수 브라우저 기능만으로 돌아서 OBS 안에서도 동작한다. */
var FB = "https://matchmaker-28187-default-rtdb.asia-southeast1.firebasedatabase.app/scoreboard/";
var CH = null;
try{ CH = new BroadcastChannel("sb_"+(ROOM||"local")); }catch(e){}

var lastSent = "";     // 내가 올린 내용 — 되돌아오면 무시(무한 반복 차단)
var putTimer = null;
var recentSent = [];
/* Firebase 는 키를 가나다순으로 다시 정렬하고 빈 배열·빈 객체·null 을 지워서 돌려준다.
   그대로 문자열 비교하면 내 것도 남의 것으로 보여 조작 화면이 계속 다시 그려진다(입력칸 커서가 튐).
   양쪽을 같은 모양으로 맞춘 뒤 비교한다. */
function canon(x){
  if(Array.isArray(x)){ return x.length ? x.map(canon) : undefined; }
  if(x && typeof x === "object"){
    var o = {}, ks = Object.keys(x).sort(), n = 0;
    ks.forEach(function(k){ var v = canon(x[k]); if(v !== undefined){ o[k] = v; n++; } });
    return n ? o : undefined;
  }
  return x === null ? undefined : x;
}
function pushRemote(){
  if(!ROOM) return;
  clearTimeout(putTimer);
  putTimer = setTimeout(function(){
    var body = JSON.stringify(S);
    lastSent = JSON.stringify(canon(S));
    recentSent.push(lastSent); if(recentSent.length > 8) recentSent.shift();
    fetch(FB + encodeURIComponent(ROOM) + ".json", {method:"PUT", body:body})
      .then(function(){ setNet(true); })
      .catch(function(){ setNet(false); });
  }, 250);
}
function save(push){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
  if(push !== false){
    if(CH) try{ CH.postMessage(S); }catch(e){}
    pushRemote();
  }
}
if(CH) CH.onmessage = function(e){ if(e.data){ S = merge(e.data); render(); } };
window.addEventListener("storage", function(e){
  if(e.key === KEY && e.newValue){ try{ S = merge(JSON.parse(e.newValue)); render(); }catch(_){} }
});

var NET = null;
function setNet(ok){
  if(NET === ok) return;
  NET = ok;
  var el = document.getElementById("net");
  if(el){ el.textContent = ok ? "🟢 연결됨" : "🔴 연결 끊김"; el.style.color = ok ? "#22C55E" : "#F87171"; }
}
var es = null;
function subscribe(){
  if(!ROOM || !window.EventSource) return;
  try{ if(es) es.close(); }catch(e){}
  es = new EventSource(FB + encodeURIComponent(ROOM) + ".json");
  var apply = function(ev){
    try{
      var m = JSON.parse(ev.data);
      if(!m || m.data == null) return;
      var v = (m.path === "/") ? m.data : null;
      if(!v) return;                                   // 부분 갱신은 쓰지 않는다(항상 통째로 올림)
      if(recentSent.indexOf(JSON.stringify(canon(v))) >= 0) return;  // 내가 올린 것 (연달아 누르면 앞선 것이 늦게 돌아온다)
      S = merge(v); render(); setNet(true);
    }catch(e){}
  };
  es.addEventListener("put", apply);
  es.addEventListener("patch", apply);
  es.onopen  = function(){ setNet(true); };
  es.onerror = function(){ setNet(false); };           // EventSource 는 알아서 다시 붙는다
}
subscribe();

/* ── 타이머 ── */
function timerMs(){ return S.timerAcc + (S.timerRunning ? (Date.now()-S.timerBase) : 0); }
function timerShown(){ return S.timerDir === "down" ? (S.timerLen||0)*60000 - timerMs() + 999 : timerMs(); }  // +999: 10:00 에서 시작해 0 에서 끝나게
function fmt(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  var m = Math.floor(s/60), ss = s%60;
  return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss;
}

/* ── 오버레이 ── */
function posStyle(el){
  var st = { transformOrigin:"", transform:"" };
  var v = POS[0]==="T" ? "top" : "bottom";
  var h = POS[1]==="L" ? "left" : (POS[1]==="R" ? "right" : "center");
  el.style[v] = "40px";
  var tr = "";
  if(h==="center"){ el.style.left="50%"; tr="translateX(-50%) "; }
  else el.style[h] = "40px";
  el.style.transformOrigin = v+" "+(h==="center"?"center":h);
  el.style.transform = tr + "scale("+SCALE+")";
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function need(){ return Math.floor((S.bestOf||3)/2) + 1; }   // 이겨야 하는 세트 수 = 세트 점 개수
function dots(n){
  var o="", m = Math.min(need(), 4);
  for(var i=1;i<=m;i++) o += '<div class="dot'+(i<=n?" on":"")+'"></div>';
  return '<div class="sets">'+o+'</div>';
}
function sideHTML(k){
  var t = S[k], p = PR();

  if(p.fouls){
    var bonus = t.fouls >= p.fouls;

  }
  var parts = [
    '<div class="bar" style="background:'+esc(t.color)+'"></div>',
    p.sets ? dots(t.sets) : "",
    '<div class="nm"><div class="tname">'+esc(t.name)+'</div>'+foul+'</div>',
    (p.serve && t.serve) ? '<div class="serve"></div>' : "",
    '<div class="score tab">'+t.score+'</div>'
  ];
  if(k === "away") parts.reverse();                   // 오른쪽 팀은 거울처럼
  return '<div class="side '+k+'">'+parts.join("")+'</div>';
}
function boardHTML(){
  if(S.over){
    var hs = S.home.hist, as = S.away.hist, word = PR().unit || "SET";
    if(!hs.length){ hs = [S.home.score]; as = [S.away.score]; word = ""; }   // 세트가 없는 종목은 최종 점수 한 칸
    var n = Math.max(hs.length, as.length, 1);

      ar += '<div class="sv'+(b>a?" win":"")+' tab">'+b+'</div>';
    }
    if(!word) cols = "120px 64px";
    return '<div class="summary">'+
      '<div class="srow" style="grid-template-columns:'+cols+';height:auto;margin-bottom:6px">'+
        '<div class="hd">FINAL SCORE</div>'+hd+'</div>'+
      '<div class="srow" style="grid-template-columns:'+cols+'"><div class="sname">'+esc(S.home.name)+'</div>'+hr+'</div>'+
      '<div class="sep"></div>'+
      '<div class="srow" style="grid-template-columns:'+cols+'"><div class="sname">'+esc(S.away.name)+'</div>'+ar+'</div>'+
    '</div>';
  }
  if(S.sport === "TENNIS") return tennisHTML();
  return '<div class="board">'+
    sideHTML("home")+
    '<div class="center">'+
      '<div style="display:flex;align-items:center;gap:8px">'+
        (S.stage?'<span class="stage">'+esc(S.stage)+'</span><span style="color:#fff;opacity:.3;font-size:10px">/</span>':"")+
        '<span class="period">'+esc(S.period)+'</span>'+
      '</div>'+
      (S.showTimer?'<div class="timer tab">'+fmt(timerShown())+'</div>':"")+
    '</div>'+
    sideHTML("away")+
  '</div>';
}
/* ── 테니스 ── */
function other(k){ return k==="home" ? "away" : "home"; }
function ptLabel(k){
  var a = S[k].pts, b = S[other(k)].pts;
  if(S.tn.tb) return String(a);                       // 타이브레이크는 1·2·3…
  if(a>=3 && b>=3) return (!S.tn.noAd && a>b) ? "AD" : "40";
  return ["0","15","30","40"][Math.min(a,3)];
}
function tennisHTML(){
  var n = Math.max(S.home.hist.length, S.away.hist.length);
  function row(k){
    var t = S[k], o = S[other(k)], h = "";
    for(var i=0;i<n;i++){
      var a = t.hist[i]||0, b = o.hist[i]||0;

      (n?'<div class="thist">'+h+'</div>':"")+
      '<div class="tgm tab">'+t.games+'</div>'+

  }
  return '<div class="tboard">'+

function setServe(k){ S.home.serve = (k==="home"); S.away.serve = (k==="away"); }
function server(){ return S.home.serve ? "home" : "away"; }
function hasProgress(){
  return S.sport === "TENNIS" ? !!(S.home.games||S.away.games) : !!(S.home.score||S.away.score);
}
/* 이번 세트를 기록으로 넘긴다 (세트제 = 점수, 테니스 = 게임 수) */
function closeSet(){
  var tn = S.sport === "TENNIS";
  var a = tn ? S.home.games : S.home.score, b = tn ? S.away.games : S.away.score;
  S.home.hist.push(a); S.away.hist.push(b);
  if(a > b) S.home.sets++; else if(b > a) S.away.sets++;
  S.home.score = S.away.score = 0;
  S.home.games = S.away.games = 0;
  S.home.pts = S.away.pts = 0;
  S.tn.tb = false;
  S.period = (PR().unit||"SET") + " " + (S.home.hist.length + 1);
  if(PR().serve === "tt"){ S.firstServe = other(S.firstServe); ttServe(); }   // 탁구: 세트마다 첫 서브 교대
}
function matchDecided(){ return S.home.sets >= need() || S.away.sets >= need(); }

/* 세트 목표 점수 — 배구 마지막 세트는 15점 */
function setTarget(){
  var p = PR();
  if(!p.target) return 0;
  var last = p.lastTarget && S.bestOf > 1 && S.home.hist.length === S.bestOf - 1;
  return last ? p.lastTarget : p.target;
}
/* 이번 세트를 이미 딴 팀 ("home"|"away"|"") — 자동으로 끝내지 않고 「세트 종료」를 깜빡이게만 한다 */
function setWinner(){
  var t = setTarget(), p = PR();
  if(!t || !p.sets || S.sport === "TENNIS") return "";
  function won(x, y){ return (x >= t && x - y >= (p.winBy||2)) || (p.cap && x >= p.cap); }
  return won(S.home.score, S.away.score) ? "home" : won(S.away.score, S.home.score) ? "away" : "";
}
/* 탁구 서브: 2점마다 교대, 듀스(10:10)부터는 1점마다 */
function ttServe(){
  var h = S.home.score, a = S.away.score, d = (setTarget()||11) - 1, n = h + a;
  var sw = (h >= d && a >= d) ? d + (n - 2*d) : Math.floor(n/2);
  setServe(sw % 2 ? other(S.firstServe) : S.firstServe);
}

/* 기간 넘기기 — 전반→후반, 1Q→2Q, ROUND 1→2. 시간은 처음으로 */
function firstPeriod(){
  var p = PR();
  if(p.periods) return p.periods[0];
  return (p.unit ? p.unit + " " : "") + "1";
}
function stepPeriod(dir){
  var p = PR();
  if(p.periods){
    var i = p.periods.indexOf(S.period);
    i = (i < 0) ? (dir > 0 ? 0 : 0) : Math.max(0, Math.min(p.periods.length-1, i + dir));
    S.period = p.periods[i];
  }else{
    var m = /(\d+)\s*$/.exec(S.period), n = Math.max(1, (m ? +m[1] : 0) + dir);
    S.period = (p.unit ? p.unit + " " : "") + n;
  }
  if(p.fouls && S.period !== "OT"){ S.home.fouls = 0; S.away.fouls = 0; }   // 팀파울은 쿼터마다 (연장은 4쿼터에 이어서)
  S.timerAcc = 0; S.timerRunning = false; S.timerBase = Date.now();
}
/* 종목을 바꾸면 그 종목 기본값으로 */
function applySport(v){
  S.sport = v;
  var p = PR();
  if(p.bestOf) S.bestOf = p.bestOf;
  S.showTimer = !!p.timer;
  S.timerDir = p.timer || "up";
  if(p.timerLen) S.timerLen = p.timerLen;
  S.timerAcc = 0; S.timerRunning = false;
  S.period = firstPeriod();
  if(p.serve === "tt") ttServe();
}
/* 포인트 1개 — 게임·세트·타이브레이크·서브 교대까지 여기서 전부 처리한다 */
function tennisPoint(k){
  var me = S[k], op = S[other(k)], T = S.tn;
  me.pts++;
  if(T.tb){
    if(me.pts >= 7 && me.pts - op.pts >= 2) return winGame(k);
    if((me.pts + op.pts) % 2 === 1) setServe(other(server()));   // 첫 1포인트 뒤, 이후 2포인트마다
    return "";
  }
  var won = T.noAd ? me.pts >= 4 : (me.pts >= 4 && me.pts - op.pts >= 2);
  if(won) return winGame(k);
  if(me.pts >= 4 && me.pts === op.pts){ me.pts = 3; op.pts = 3; }  // 듀스로 되돌림 (숫자가 끝없이 커지지 않게)
  return "";
}
function winGame(k){
  var me = S[k], op = S[other(k)], T = S.tn, G = T.games;
  var wasTb = T.tb;
  me.games++; me.pts = 0; op.pts = 0; T.tb = false;
  // 타이브레이크를 먼저 받은 쪽이 다음 세트 첫 서브
  setServe(wasTb ? other(T.tbServer) : other(server()));
  if(wasTb || (me.games >= G && me.games - op.games >= 2)){
    var name = me.name;
    closeSet();
    return matchDecided()
      ? name+" 승리!\n「경기 종료」를 누르면 결과표가 나갑니다"
      : name+" 세트 획득\n"+S.period+" 시작";
  }
  if(me.games === G && op.games === G){
    T.tb = true; T.tbServer = server();
    return G+":"+G+" 타이브레이크";
  }
  return "";
}

  if(S.sport === "TENNIS"){
    o += '<div class="grid2">'+
      '<div><label class="f">세트당 게임</label>'+sel("tnGames", [[6,"6게임"],[4,"4게임 (단축)"]], S.tn.games)+'</div>'+
      '<div><label class="f">듀스</label>'+sel("tnAd", [["ad","어드밴티지"],["noad","노애드"]], S.tn.noAd?"noad":"ad")+'</div>'+
    '</div>'+
    '<div class="hint">'+S.tn.games+':'+S.tn.games+'이 되면 <b>타이브레이크(7점, 2점 차)</b>가 자동으로 켜집니다. 게임이 끝나면 서브도 자동으로 넘어갑니다.</div>';
  }
  if(p.sets){
    o += '<label class="f">경기 방식</label>'+
      sel("bestOf", [1,3,5,7].map(function(b){ return [b, b===1 ? "단판" : b+(p.unit==="GAME"?"게임":"세트")+" 중 "+(Math.floor(b/2)+1)+"선승"]; }), S.bestOf);
    var t = setTarget();
    if(t && S.sport !== "CUSTOM"){
      o += '<div class="hint">'+p.label+' : <b>'+p.target+'점'+(p.lastTarget?' (마지막 세트 '+p.lastTarget+'점)':'')+
        ', '+(p.winBy||2)+'점 차'+(p.cap?', '+p.cap+'점 상한':'')+'</b>. 도달하면 「세트 종료」가 깜빡입니다 — 최종 점수를 보여준 뒤 누르세요.'+
        (p.serve==="tt"?'<br>서브는 <b>2점마다 자동 교대</b>(듀스부터 1점마다). 첫 서브만 맞춰 주세요.':'')+'</div>';
    }
  }
  if(p.fouls && S.sport !== "CUSTOM"){
    o += '<div class="hint">팀파울은 「다음 ▶」으로 쿼터를 넘기면 0으로 돌아갑니다 (OT는 4쿼터에 이어서). '+p.fouls+'개부터 <b>BONUS</b> 표시.</div>';
  }
  return o;
}
/* 작은 ± 줄 — 세트 수·팀파울을 손으로 고칠 때 */
function adjHTML(label, k, field, val){
  return '<div class="row gadj">'+
    '<span>'+label+' <b style="color:var(--ui-fg);font-size:15px">'+val+'</b></span>'+
    '<button data-adj="'+k+'|'+field+'|-1">−</button>'+
    '<button data-adj="'+k+'|'+field+'|1">+</button>'+
  '</div>';
}
function renderControl(){
  var base = location.origin + location.pathname;
  var ovl = base + "?view=overlay&pos=" + POS + "&scale=" + SCALE + "&theme=" + THEME + (ROOM?"&room="+encodeURIComponent(ROOM):"");
  document.getElementById("app").innerHTML =
  '<div class="wrap">'+
    '<h1>'+PR().emoji+' 라이브 스코어보드 — 조작</h1>'+
    '<div class="sub">여기서 누르면 <b>오버레이 창이 바로 바뀝니다.</b></div>'+

    '<div class="card"><h2>'+PR().emoji+' '+esc(PR().label)+' · '+esc(S.period)+'</h2><div class="teams">'+teamHTML("home")+teamHTML("away")+'</div>'+
      '<div class="grid3" style="margin-top:10px">'+
        '<button id="undo"'+(UNDO.length?"":" disabled style=\"opacity:.4\"")+'>↶ 되돌리기</button>'+
        '<button id="swap">↔ 좌우</button>'+
        (PR().sets
          ? '<button id="endset"'+(setWinner()?' class="blink"':'')+'>세트 종료</button>'
          : '<button data-step="1">다음 ▶</button>')+
      '</div>'+
      (PR().sets ? "" :
      '<div class="row" style="margin-top:8px">'+
        '<button data-step="-1" style="flex:0 0 30%">◀ 이전</button>'+
        '<div style="flex:1;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:17px">'+esc(S.period||"-")+'</div>'+
      '</div>')+
      '<div class="row" style="margin-top:8px">'+
        (S.sport==="TENNIS"?'<button id="tgTb" class="'+(S.tn.tb?"on":"")+'">'+(S.tn.tb?"🔥 타이브레이크 중":"타이브레이크 켜기")+'</button>':"")+
        '<button id="over" class="'+(S.over?"on":"")+'">'+(S.over?"경기중으로":"경기 종료 (결과표)")+'</button>'+
      '</div>'+
    '</div>'+

    '<div class="card"><h2>미리보기</h2>'+
      '<div class="prevnote">실제 송출 화면과 같습니다 (배경은 투명하게 나갑니다)</div>'+
      '<div class="prev '+(THEME==="light"?"lightbg":"dark")+'">'+boardHTML()+'</div>'+
    '</div>'+

    '<div class="card"><h2>경기 정보</h2>'+
      '<div class="grid2">'+
        '<div><label class="f">단계 (예: 준결승)</label><input class="t" id="fStage" value="'+esc(S.stage)+'" maxlength="10"></div>'+
        '<div><label class="f">현재 (예: SET 2)</label><input class="t" id="fPeriod" value="'+esc(S.period)+'" maxlength="10"></div>'+
      '</div>'+
      '<div class="grid2">'+
        '<div><label class="f">대회명 (오른쪽 위)</label><input class="t" id="tour" value="'+esc(S.tournament)+'" maxlength="24"></div>'+
        '<div><label class="f">채널명 (왼쪽 위)</label><input class="t" id="ch" value="'+esc(S.channel)+'" maxlength="24"></div>'+
      '</div>'+
      '<label class="f">종목</label>'+
      '<select class="t" id="sport">'+
        Object.keys(PRESETS).map(function(k){
          return '<option value="'+k+'"'+(S.sport===k?" selected":"")+'>'+PRESETS[k].emoji+' '+PRESETS[k].label+'</option>';
        }).join("")+
      '</select>'+
      sportOptionsHTML()+
      '<label class="f">시간</label>'+
      '<div class="grid2">'+
        '<button id="tgTimer" class="'+(S.showTimer?"on":"")+'">'+(S.showTimer?"⏱ 시간 표시 켬":"시간 표시 끔")+'</button>'+
        '<button id="tgRun">'+(S.timerRunning?"⏸ 시간 멈춤":"▶ 시간 시작")+'</button>'+
      '</div>'+
      '<div class="grid2" style="margin-top:8px">'+
        '<select class="t" id="timerDir">'+
          '<option value="up"'+(S.timerDir!=="down"?" selected":"")+'>⬆ 올라감 (0:00부터)</option>'+
          '<option value="down"'+(S.timerDir==="down"?" selected":"")+'>⬇ 내려감 (정한 분부터)</option>'+
        '</select>'+
        (S.timerDir==="down"
          ? '<div class="row" style="align-items:center"><input class="t" id="timerLen" type="number" min="0" step="0.5" value="'+S.timerLen+'" style="flex:1"><span style="font-weight:800;color:var(--ui-sub)">분</span></div>'
          : '<div></div>')+
      '</div>'+
      '<div class="grid2" style="margin-top:8px">'+
        '<button id="rstTimer">시간 처음으로</button>'+
        '<button id="reset" class="warn">전부 초기화</button>'+
      '</div>'+
    '</div>'+

    '<div class="card"><h2>기기 연결 <span id="net" style="font-size:12px;font-weight:800;margin-left:6px">'+(ROOM?"연결 중…":"꺼짐")+'</span></h2>'+
      '<div class="hint" style="margin-top:0">폰으로 누르고 <b>OBS 화면이 바뀌게</b> 하려면 방 코드가 있어야 합니다.<br>'+
      '조작하는 기기와 오버레이가 <b>같은 코드</b>를 쓰면 이어집니다.</div>'+
      '<div class="grid2" style="margin-top:10px">'+
        '<input class="t" id="room" value="'+esc(ROOM)+'" placeholder="예: yj1" maxlength="16">'+
        '<button id="mkRoom">🎲 코드 만들기</button>'+
      '</div>'+
      '<div class="grid2" style="margin-top:8px">'+
        '<button id="applyRoom">연결</button>'+
        '<button id="offRoom">연결 끄기</button>'+
      '</div>'+
    '</div>'+

    '<div class="card"><h2>송출에 넣을 주소</h2>'+
      '<div class="urlbox" id="ovlUrl">'+esc(ovl)+'</div>'+
      '<div class="grid2" style="margin-top:8px">'+
        '<button id="copyUrl">📋 주소 복사</button>'+
        '<button id="openOvl">🖥 오버레이 창 열기</button>'+
      '</div>'+
      '<label class="f">화면 색</label>'+
      '<div class="grid2">'+
        '<button id="thDark" class="'+(THEME==="dark"?"on":"")+'">🌙 어두운 점수판</button>'+
        '<button id="thLight" class="'+(THEME==="light"?"on":"")+'">☀️ 밝은 점수판</button>'+
      '</div>'+
      '<label class="f">위치</label>'+
      '<select class="t" id="pos">'+
        ["TL","TC","TR","BL","BC","BR"].map(function(p){
          var ko={TL:"왼쪽 위",TC:"가운데 위",TR:"오른쪽 위",BL:"왼쪽 아래",BC:"가운데 아래",BR:"오른쪽 아래"}[p];
          return '<option value="'+p+'"'+(POS===p?" selected":"")+'>'+ko+'</option>';
        }).join("")+
      '</select>'+
      '<label class="f">크기 ('+SCALE.toFixed(2)+'배)</label>'+
      '<input class="t" type="range" id="scale" min="0.5" max="2" step="0.05" value="'+SCALE+'">'+
      '<div class="hint">'+
        '<b>OBS</b> : 소스 추가 → 브라우저 → 위 주소 붙여넣기 → 너비 1920 높이 1080<br>'+
        '<b>카메라파이</b> : 오버레이 → 웹 → 위 주소 붙여넣기<br>'+
        '⚠️ OBS·폰에서 쓰시려면 <b>위에서 방 코드를 연결</b>하세요. 코드가 없으면 같은 브라우저 창끼리만 이어집니다.'+
      '</div>'+
    '</div>'+
  '</div>';

  bindControl();
}

/* 되돌리기 — 누르기 직전 상태를 쌓아 둔다 (이 기기에서 누른 것만) */
var UNDO = [];
function snap(){ UNDO.push(JSON.stringify(S)); if(UNDO.length > 60) UNDO.shift(); }

function bindControl(){
  var $ = function(id){ return document.getElementById(id); };
  document.querySelectorAll("[data-s]").forEach(function(b){
    b.onclick = function(){
      snap();
      var p = b.dataset.s.split("|"), t = S[p[0]], d = +p[1], rule = PR().serve;
      var before = setWinner();
      t.score = Math.max(0, t.score + d);
      if(rule === "winner" && d > 0) setServe(p[0]);    // 득점한 팀이 서브
      if(rule === "tt") ttServe();
      save(); render();
      var w = setWinner();
      if(w && w !== before){
        var last = S[w].sets + 1 >= need();
        toast(S[w].name+" "+(last?"경기":"세트")+" 획득 "+S.home.score+":"+S.away.score+"\n「세트 종료」를 누르세요", 3000);
      }
    };
  });
  document.querySelectorAll("[data-p]").forEach(function(b){
    b.onclick = function(){
      var p = b.dataset.p.split("|"), t = S[p[0]];
      if(+p[1] < 0){
        if(!t.pts){ toast("이번 게임 포인트가 없습니다\n지난 게임은 ↶ 되돌리기", 2200); return; }
        snap(); t.pts--;
        save(); render(); return;
      }
      snap();
      var msg = tennisPoint(p[0]);
      save(); render();
      if(msg) toast(msg, 2600);
    };
  });
  document.querySelectorAll("[data-adj]").forEach(function(b){
    b.onclick = function(){
      snap();
      var p = b.dataset.adj.split("|"), t = S[p[0]];
      t[p[1]] = Math.max(0, (t[p[1]]||0) + (+p[2]));
      save(); render();
    };
  });
  document.querySelectorAll("[data-edit]").forEach(function(el){
    el.onclick = function(){
      var t = S[el.dataset.edit];
      var v = prompt(t.name + " 점수", t.score);
      if(v === null) return;
      v = parseInt(v, 10);
      if(isNaN(v) || v < 0){ toast("0 이상의 숫자를 넣어 주세요", 2000); return; }
      snap(); t.score = v;
      if(PR().serve === "tt") ttServe();
      save(); render();
    };
  });
  document.querySelectorAll("[data-serve]").forEach(function(b){
    b.onclick = function(){
      snap();
      var k = b.dataset.serve;
      if(PR().serve === "tt" && server() !== k) S.firstServe = other(S.firstServe);   // 계산 기준을 같이 옮긴다
      setServe(k); save(); render();
    };
  });
  $("undo").onclick = function(){
    if(!UNDO.length) return;
    S = JSON.parse(UNDO.pop()); save(); render(); toast("되돌렸습니다", 1200);
  };
  if($("tgTb")) $("tgTb").onclick = function(){
    snap(); S.tn.tb = !S.tn.tb; S.home.pts = S.away.pts = 0;
    if(S.tn.tb) S.tn.tbServer = server();
    save(); render();
  };
  if($("tnGames")) $("tnGames").onchange = function(){ S.tn.games = +$("tnGames").value; save(); render(); };
  if($("tnAd"))    $("tnAd").onchange    = function(){ S.tn.noAd = $("tnAd").value === "noad"; save(); render(); };
  if($("bestOf"))  $("bestOf").onchange  = function(){ S.bestOf = +$("bestOf").value; save(); render(); };
  document.querySelectorAll("[data-n]").forEach(function(i){
    i.oninput = function(){ S[i.dataset.n].name = i.value; save(); renderOverlayPreviewOnly(); };
  });
  document.querySelectorAll("[data-c]").forEach(function(i){
    i.oninput = function(){ S[i.dataset.c].color = i.value; save(); render(); };
  });

  $("swap").onclick = function(){
    snap();
    var h = S.home; S.home = S.away; S.away = h;
    if(S.tn.tb) S.tn.tbServer = other(S.tn.tbServer);
    S.firstServe = other(S.firstServe);
    save(); render(); toast("좌우를 바꿨습니다");
  };
  if($("endset")) $("endset").onclick = function(){
    var tn = S.sport === "TENNIS";
    if(!hasProgress()){ toast(tn ? "게임이 0:0입니다" : "점수가 0:0입니다", 1800); return; }
    snap(); closeSet();
    save(); render();
    if(matchDecided()){
      var w = S.home.sets > S.away.sets ? S.home : S.away;
      toast(w.name+" 승리! ("+S.home.sets+":"+S.away.sets+")\n「경기 종료」를 누르면 결과표가 나갑니다", 3200);
    }else toast("세트를 저장했습니다\n"+S.period+" 시작");
  };
  document.querySelectorAll("[data-step]").forEach(function(b){
    b.onclick = function(){ snap(); stepPeriod(+b.dataset.step); save(); render(); };
  });
  $("over").onclick = function(){
    snap();
    S.over = !S.over;
    if(S.over && PR().sets && hasProgress()) closeSet();   // 마지막 세트가 안 닫혔으면 닫아준다
    save(); render();
  };

  [["fStage","stage"],["fPeriod","period"]].forEach(function(pair){
    $(pair[0]).oninput = function(){ S[pair[1]] = $(pair[0]).value; save(); renderOverlayPreviewOnly(); };
  });
  $("tour").oninput = function(){ S.tournament = $("tour").value; save(); };
  $("ch").oninput   = function(){ S.channel    = $("ch").value;   save(); };
  $("sport").onchange = function(){
    snap(); applySport($("sport").value); save(); render();
    toast(PR().emoji+" "+PR().label+"(으)로 바꿨습니다\n점수는 그대로입니다 — 새 경기면 「전부 초기화」", 2600);
  };
  if($("timerDir")) $("timerDir").onchange = function(){ S.timerDir = $("timerDir").value; save(); render(); };
  if($("timerLen")) $("timerLen").onchange = function(){
    S.timerLen = Math.max(0, parseFloat($("timerLen").value)||0); save(); render();
  };
  document.querySelectorAll("[data-cu]").forEach(function(el){
    el.onchange = function(){
      var f = el.dataset.cu;
      S.custom[f] = (el.type === "checkbox") ? el.checked : el.value;
      if(f === "unit") S.period = firstPeriod();
      save(); render();
    };
  });

  $("tgTimer").onclick = function(){ S.showTimer = !S.showTimer; save(); render(); };
  $("tgRun").onclick = function(){
    if(S.timerRunning){ S.timerAcc = timerMs(); S.timerRunning = false; }
    else { S.timerBase = Date.now(); S.timerRunning = true; }
    save(); render();
  };
  $("rstTimer").onclick = function(){ S.timerAcc = 0; S.timerBase = Date.now(); save(); render(); };
  $("reset").onclick = function(){
    if(!confirm("팀 이름·점수·세트를 전부 처음 상태로 돌립니다.")) return;
    snap();
    var keep = {sport:S.sport, tn:S.tn, custom:S.custom, bestOf:S.bestOf, timerDir:S.timerDir, timerLen:S.timerLen, showTimer:S.showTimer};
    S = JSON.parse(JSON.stringify(DEF));
    for(var k in keep) S[k] = keep[k];               // 종목·경기 방식 설정은 남긴다
    S.tn.tb = false; S.period = firstPeriod();
    if(PR().serve === "tt") ttServe();
    save(); render(); toast("초기화했습니다 (종목 설정은 그대로)");
  };

  $("mkRoom").onclick = function(){
    $("room").value = Math.random().toString(36).slice(2,6);
  };
  $("applyRoom").onclick = function(){
    var v = ($("room").value||"").trim().replace(/[^A-Za-z0-9_-]/g,"");
    if(!v){ toast("코드를 넣어 주세요", 2000); return; }
    ROOM = v; KEY = "sb_state_v1_" + ROOM;
    try{ localStorage.setItem("sb_room", ROOM); }catch(e){}
    subscribe(); pushRemote(); refreshUrl(); render();
    toast("「"+ROOM+"」 방에 연결했습니다\n오버레이 주소도 바뀌었습니다", 3200);
  };
  $("offRoom").onclick = function(){
    ROOM = ""; KEY = "sb_state_v1";
    try{ localStorage.removeItem("sb_room"); }catch(e){}
    try{ if(es) es.close(); }catch(e){}
    NET = null; refreshUrl(); render();
    toast("연결을 껐습니다", 2000);
  };
  $("thDark").onclick  = function(){ THEME="dark";  saveTheme(); refreshUrl(); render(); };
  $("thLight").onclick = function(){ THEME="light"; saveTheme(); refreshUrl(); render(); };
  $("pos").onchange  = function(){ POS = $("pos").value; refreshUrl(); render(); };
  $("scale").oninput = function(){ SCALE = parseFloat($("scale").value)||1; refreshUrl(); render(); };
  $("copyUrl").onclick = function(){
    var t = $("ovlUrl").textContent;
    if(navigator.clipboard) navigator.clipboard.writeText(t).then(function(){ toast("복사했습니다"); })
      .catch(function(){ toast("복사 실패 — 길게 눌러 복사하세요", 3000); });
    else toast("길게 눌러 복사하세요", 3000);
  };
  $("openOvl").onclick = function(){
    window.open($("ovlUrl").textContent, "sbOverlay", "width=1280,height=720");
  };
}
function refreshUrl(){
  var base = location.origin + location.pathname;
  var r = ROOM ? "&room="+encodeURIComponent(ROOM) : "";
  var u = base + "?view=overlay&pos=" + POS + "&scale=" + SCALE + "&theme=" + THEME + r;
  var el = document.getElementById("ovlUrl"); if(el) el.textContent = u;
  history.replaceState(null, "", base + "?view=control&pos=" + POS + "&scale=" + SCALE + "&theme=" + THEME + r);
}
/* 이름·단계만 바뀔 때는 입력 포커스를 잃지 않게 미리보기만 다시 그린다 */
function renderOverlayPreviewOnly(){
  var p = document.querySelector(".prev");
  if(p) p.innerHTML = boardHTML();
}

function saveTheme(){ try{ localStorage.setItem("sb_theme", THEME); }catch(e){} }
/* 조작 화면에서 고른 색을 다음에도 기억한다 (주소로 직접 지정한 건 그게 우선) */
if(!Q.get("theme")){ try{ var t=localStorage.getItem("sb_theme"); if(t==="light"||t==="dark") THEME=t; }catch(e){} }

var toastTimer = null;
function toast(msg, ms){
  var el = document.getElementById("toast");
  el.textContent = msg; el.className = "toast show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = "toast"; }, ms||1800);
}

function render(){
  var th = (THEME==="light" ? " light" : "");
  if(VIEW === "overlay"){ document.body.className = th.trim(); renderOverlay(); }
  else { document.body.className = "control" + th; renderControl(); }
}
render();

/* 시간 표시가 켜져 있으면 1초마다 갱신 */
setInterval(function(){
  if(!S.showTimer) return;
  if(VIEW === "overlay"){ var t = document.querySelector(".timer"); if(t) t.textContent = fmt(timerShown()); }
  else { var p = document.querySelector(".prev .timer"); if(p) p.textContent = fmt(timerShown()); }
}, 500);
})();
</script>
